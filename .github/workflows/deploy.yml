name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.2
        run: |
          mkdir -p ~/.local/opt ~/.local/bin
          cd ~/.local/opt
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot && chmod +x godot
          ln -sf ~/.local/opt/godot ~/.local/bin/godot

      - name: Install web export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          curl -L -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot_tpz
          mv /tmp/godot_tpz/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Export web build
        run: |
          mkdir -p builds/web
          godot --headless --export-release "Web" builds/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
